name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: [latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install tool dependencies
        run: bun install --cwd tool/api-scalar --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tool
        run: bun run tool:typecheck

      - name: Lint (Biome)
        run: bun run lint

      - name: Run Unit Tests
        run: bun test

      - name: Test tool
        run: bun run tool:test

      - name: Build
        run: bun run build
